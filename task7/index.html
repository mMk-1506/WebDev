
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laundry Services</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navigation Bar -->
    <header class="navbar">
        <div class="logo">Logo</div>

        <nav class="nav-links">
            <a href="#">Home</a>
            <a href="#">Services</a>
            <a href="#">About Us</a>
            <a href="#">Contact Us</a>
        </nav>

        <div class="username">Username</div>
    </header>

    <!-- Hero Section -->
    <main class="hero">

        <!-- Left Section -->
        <div class="hero-left">
            <h1>
                Revitalize Your<br>
                Clothes with Expert<br>
                <span>Laundry Services!</span>
            </h1>

            <p>
                From premium dry cleaning to swift wash and fold, we

                rediscover the freshness of your clothes today!

            <button class="book-btn" onclick="bookService()">
                Book a service today!
            </button>
        </div>

        <!-- Right Section -->
        <div class="hero-right">
            <img
                src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS_OXlehWCMIMndmTb6-_PbpYzPVAuXRh6Pus2qO7IUOQ&s=10"

        </div>

    </main>

    <script>
        function bookService() {
            alert("Thank you for your interest! Laundry booking coming soon.");
        }
    </script>

</body>
</html>
